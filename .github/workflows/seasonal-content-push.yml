name: Seasonal Content Push Workflow

on:
  schedule:
    - cron: '0 13 * * 1'   # Every Monday at 9 AM ET / 13:00 UTC
  workflow_dispatch:
    inputs:
      pins_count:
        description: 'Number of seasonal burst pins to post (default: 4)'
        required: false
        default: '4'
      dry_run:
        description: 'Dry run (simulate without posting)'
        type: boolean
        required: false
        default: false

concurrency:
  group: seasonal-content-push
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  seasonal-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps

      - name: Post Seasonal Burst Pins
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          PINTEREST_COOKIES_B64: ${{ secrets.PINTEREST_COOKIES_B64 }}
          PINTEREST_EMAIL: ${{ secrets.PINTEREST_EMAIL }}
          PINTEREST_PASSWORD: ${{ secrets.PINTEREST_PASSWORD }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          PINS_TO_POST: ${{ github.event.inputs.pins_count || '2' }}
        run: |
          DRY_RUN_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi
          python pinterest_daily_stealth.py $DRY_RUN_ARG

      - name: Commit and push history updates
        if: always()
        run: |
          set +e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posting_history_stealth.json secrets.enc 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update seasonal content history [skip ci]" || true
          fi
          git reset --hard HEAD 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          TARGET_BRANCH="${{ github.ref_name }}"
          TARGET_BRANCH="${TARGET_BRANCH:-develop}"
          git pull origin "$TARGET_BRANCH" --rebase --autostash 2>/dev/null || true
          for i in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Successfully pushed seasonal history updates to $TARGET_BRANCH"
              break
            fi
            echo "Push to $TARGET_BRANCH failed, retrying ($i/3)..."
            sleep 2
            git rebase --abort 2>/dev/null || true
            git pull origin "$TARGET_BRANCH" --rebase --autostash 2>/dev/null || true
          done
          exit 0
