name: Daily Pinterest Stealth Posting (Solution 3)

# New Stealth Playwright UI Automation Pipeline
# Uses Playwright Chromium UI automation to post pins directly on Pinterest.com
# Bypasses API scraping detection and unblocks account shadowban risks.
#
# Utilizes double encryption secrets strategy:
#   ENCRYPTION_KEY_PRIMARY and ENCRYPTION_KEY_FALLBACK

on:
  schedule:
    - cron: '0 12 * * *'   # 8:00 AM ET / 12:00 UTC — Morning East Coast commute scroll
    - cron: '30 17 * * *'  # 1:30 PM ET / 10:30 AM PT / 17:30 UTC — Mid-day lunch & shopping break
    - cron: '0 21 * * *'   # 5:00 PM ET / 2:00 PM PT / 21:00 UTC — After-work unwind scroll
    - cron: '0 2 * * *'    # 10:00 PM ET / 9:00 PM CT / 7:00 PM PT / 02:00 UTC — Night Prime-Time Bedtime Lounge (Highest US Peak!)
  workflow_dispatch:
    inputs:
      pins_count:
        description: 'Number of pins to post (default: 4)'
        required: false
        default: '4'
      pin_type:
        description: 'Pin Type to Post (auto=1 Mandatory Carousel + Product/Video/Blog mix, product, video, carousel, blog)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - product
          - video
          - carousel
          - blog
      dry_run:
        description: 'Dry run (fill form without clicking publish)'
        type: boolean
        required: false
        default: false

concurrency:
  group: pinterest-posting-stealth
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  post-to-pinterest-stealth:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: Install Playwright Chromium & System Fonts
        run: |
          python -m playwright install chromium --with-deps
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu gsfonts ffmpeg

      - name: Post daily pins via Stealth Playwright UI
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PINTEREST_DAILY_CAP: '25'
          PYTHONUNBUFFERED: '1'
        run: |
          PINS="${{ github.event.inputs.pins_count || '4' }}"
          TYPE_FLAG=""
          if [ "${{ github.event.inputs.pin_type }}" != "" ] && [ "${{ github.event.inputs.pin_type }}" != "auto" ]; then
            TYPE_FLAG="--type=${{ github.event.inputs.pin_type }}"
          fi
          
          echo "Starting Stealth Posting..."
          PINS_TO_POST=$PINS python pinterest_daily_stealth.py $TYPE_FLAG

      - name: Upload stealth screenshots (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stealth-screenshots-${{ github.run_number }}
          path: "*.png"
          retention-days: 7

      - name: Commit and push history updates
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posting_history_stealth.json .pinterest_cookies || true
          git commit -m "chore: auto-update stealth posting history [skip ci]" || echo "No changes to commit"
          git pull origin ${{ github.ref_name }} --rebase || true
          git push origin HEAD || echo "Failed to push history updates"
