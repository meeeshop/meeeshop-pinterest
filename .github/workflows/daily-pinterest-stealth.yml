name: Daily Pinterest Stealth Posting (Solution 3)

# New Stealth Playwright UI Automation Pipeline
# Uses Playwright Chromium UI automation to post pins directly on Pinterest.com
# Bypasses API scraping detection and unblocks account shadowban risks.
#
# Utilizes double encryption secrets strategy:
#   ENCRYPTION_KEY_PRIMARY and ENCRYPTION_KEY_FALLBACK

on:
  schedule:
    - cron: '30 17 * * *'  # 1x/day fresh product pin (12:30 PM EST)
  workflow_dispatch:
    inputs:
      pins_count:
        description: 'Number of pins to post (default: 4)'
        required: false
        default: '4'
      pin_type:
        description: 'Pin Type to Post (auto=1 Mandatory Carousel + Product/Video/Blog mix, product, video, carousel, blog)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - product
          - video
          - carousel
          - blog
      dry_run:
        description: 'Dry run (fill form without clicking publish)'
        type: boolean
        required: false
        default: false

concurrency:
  group: pinterest-posting-stealth
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  post-to-pinterest-stealth:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: Install Playwright Chromium & System Fonts
        run: |
          python -m playwright install chromium --with-deps
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu gsfonts ffmpeg

      - name: Post daily pins via Stealth Playwright UI
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PINTEREST_DAILY_CAP: '25'
          PYTHONUNBUFFERED: '1'
        run: |
          PINS="${{ github.event.inputs.pins_count || '4' }}"
          TYPE_FLAG=""
          if [ "${{ github.event.inputs.pin_type }}" != "" ] && [ "${{ github.event.inputs.pin_type }}" != "auto" ]; then
            TYPE_FLAG="--type=${{ github.event.inputs.pin_type }}"
          fi
          
          echo "Starting Stealth Posting..."
          PINS_TO_POST=$PINS python pinterest_daily_stealth.py $TYPE_FLAG

      - name: Upload stealth screenshots (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stealth-screenshots-${{ github.run_number }}
          path: "*.png"
          retention-days: 7

      - name: Commit and push history updates
        if: always()
        run: |
          set +e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posting_history_stealth.json secrets.enc 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update stealth posting history [skip ci]" || true
          fi
          git reset --hard HEAD 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          TARGET_BRANCH="${{ github.ref_name }}"
          TARGET_BRANCH="${TARGET_BRANCH:-develop}"
          git pull origin "$TARGET_BRANCH" --rebase --autostash 2>/dev/null || true
          for i in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Successfully pushed stealth posting history to $TARGET_BRANCH"
              break
            fi
            echo "Push to $TARGET_BRANCH failed, retrying ($i/3)..."
            sleep 2
            git rebase --abort 2>/dev/null || true
            git pull origin "$TARGET_BRANCH" --rebase --autostash 2>/dev/null || true
          done
          exit 0
