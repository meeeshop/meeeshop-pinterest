name: Daily Pinterest Posting V2

# V2 — Phase 2 re-activation strategy
# 2 pins per run × 4 runs = 8 pins/day (safe limit for dormant account re-activation)
# Uses content_generator_v2: USA keywords, search-first titles, 150-200 char descriptions
#
# USA Women's Pinterest Peak Times (2026 research):
#   Tue-Thu 10am-1pm is highest engagement window overall.
#   Saturdays 8am-11am: weekend morning scroll (fashion planning).
#   Evenings 8pm-10pm ET: second peak (browsing before bed).
#
# 4-slot schedule covers all major USA time zones:
#   14:00 UTC = 10 AM ET / 9 AM CT / 7 AM PT  — mid-morning (top slot, Tue-Thu peak)
#   18:00 UTC =  2 PM ET / 1 PM CT / 11 AM PT — post-lunch browse
#   23:00 UTC =  7 PM ET / 6 PM CT / 4 PM PT  — after-work / pre-dinner
#   02:00 UTC = 10 PM ET / 9 PM CT / 7 PM PT  — evening prime (bed-time scroll)

on:
  schedule:
    - cron: '0 13 * * *'   # 9 AM ET / 13:00 UTC — morning coffee scroll
    - cron: '0 17 * * *'   # 1 PM ET / 17:00 UTC — post-lunch browse
    - cron: '0 22 * * *'   # 6 PM ET / 22:00 UTC — after-work scroll
    - cron: '0 1  * * *'   # 9 PM ET / 01:00 UTC — evening prime time bedtime scroll
  workflow_dispatch:
    inputs:
      pins_count:
        description: 'Number of pins to post (default: 2)'
        required: false
        default: '2'
      image_style:
        description: 'Pin Image Style (auto, hero, carousel, collage, card)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - hero
          - carousel
          - collage
          - card
      dry_run:
        description: 'Dry run (simulate daily posting without actually creating pins)'
        type: boolean
        required: false
        default: false

concurrency:
  group: pinterest-posting-v2
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  post-to-pinterest-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install system fonts and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu gsfonts ffmpeg

      - name: Post daily pins (V2)
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          FORCE_IMAGE_STYLE: ${{ github.event.inputs.image_style || 'auto' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PINTEREST_DAILY_CAP: '15'
          PINTEREST_WEEKEND_CAP: '18'
        run: |
          # Weekend boost: Saturdays and Sundays are high-engagement planning days
          # for USA women shoppers — allow 3 pins per slot instead of 2
          if [ -n "${{ github.event.inputs.pins_count }}" ]; then
            PINS="${{ github.event.inputs.pins_count }}"
          else
            DAY_OF_WEEK=$(date +%u)  # 1=Mon ... 6=Sat 7=Sun
            if [ "$DAY_OF_WEEK" = "6" ] || [ "$DAY_OF_WEEK" = "7" ]; then
              PINS="3"
              echo "Weekend detected — posting 3 pins this slot"
            else
              PINS="2"
            fi
          fi
          PINS_TO_POST=$PINS python pinterest_daily_v2.py


      - name: Commit and push history updates
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add refresh_history_v2.json refresh_history.json posting_history_v2.json posting_history.json daily_pin_count.json dynamic_boards.json || true
          git commit -m "chore: auto-update posting and refresh history [skip ci]" || echo "No changes to commit"
          git pull origin ${{ github.ref_name }} --rebase || true
          git push origin HEAD || echo "Failed to push history updates"

      - name: Upload V2 posting history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posting-history-v2-${{ github.run_number }}
          path: posting_history_v2.json
          retention-days: 30
