name: Daily Old Boards Pinterest Posting

# Dedicated workflow to revive and maintain 1-year-old Pinterest boards with relevant Shopify product pins.
#
# Runs 2x daily during peak USA women's browsing hours:
#   15:00 UTC = 11 AM ET / 10 AM CT / 8 AM PT — late morning inspiration scroll
#   21:00 UTC =  5 PM ET / 4 PM CT / 2 PM PT — end-of-workday / commute scroll

on:
  schedule:
    - cron: '0 15 * * *'   # 11 AM ET
    - cron: '0 21 * * *'   # 5 PM ET
  workflow_dispatch:
    inputs:
      pins_count:
        description: 'Number of pins to post to 1-year-old boards (default: 4)'
        required: false
        default: '4'
      create_trending_boards:
        description: 'Check & auto-create missing USA trending boards'
        type: boolean
        required: false
        default: true
      dry_run:
        description: 'Dry run mode (simulate posting without creating live pins)'
        type: boolean
        required: false
        default: false

concurrency:
  group: pinterest-old-boards-posting
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  post-to-old-boards:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install system fonts and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu gsfonts ffmpeg

      - name: Check and auto-create USA trending boards
        if: ${{ github.event.inputs.create_trending_boards != 'false' }}
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          DRY_RUN_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi
          python create_trending_boards.py $DRY_RUN_ARG || echo "Board creation completed with warnings"

      - name: Post to 1-year-old boards
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          PINS="${{ github.event.inputs.pins_count || '4' }}"
          DRY_RUN_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi
          python old_boards_poster.py --pins-count $PINS $DRY_RUN_ARG

      - name: Commit and push history updates
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posting_history_v2.json daily_pin_count.json dynamic_boards.json || true
          git commit -m "chore: auto-update 1y board posting history [skip ci]" || echo "No changes to commit"
          git pull origin ${{ github.ref_name }} --rebase || true
          git push origin HEAD || echo "Failed to push history updates"

      - name: Upload posting history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: old-boards-posting-history-${{ github.run_number }}
          path: posting_history_v2.json
          retention-days: 30
