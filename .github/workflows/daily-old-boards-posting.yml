name: Daily Old Boards Pinterest Posting

# Dedicated workflow to revive and maintain 1-year-old Pinterest boards with relevant Shopify product pins.
#
# Runs 2x daily during peak USA women's browsing hours:
#   15:00 UTC = 11 AM ET / 10 AM CT / 8 AM PT — late morning inspiration scroll
#   21:00 UTC =  5 PM ET / 4 PM CT / 2 PM PT — end-of-workday / commute scroll

on:
# ==============================================================================
# [PAUSED - ANTI-SHADOWBAN SAFEGUARD]
# Automated cron paused to prevent py3pin HTTP API shadowban risk.
# Niche board distribution is safely handled by repin-products-board-stealth.yml
# (Playwright Chromium stealth UI automation). Manual dispatch remains active.
# ==============================================================================
#   schedule:
#     - cron: '0 15 * * *'   # 11 AM ET
#     - cron: '0 21 * * *'   # 5 PM ET
  workflow_dispatch:
    inputs:
      pins_count:
        description: 'Number of pins to post to 1-year-old boards (default: 4)'
        required: false
        default: '4'
      create_trending_boards:
        description: 'Check & auto-create missing USA trending boards'
        type: boolean
        required: false
        default: true
      dry_run:
        description: 'Dry run mode (simulate posting without creating live pins)'
        type: boolean
        required: false
        default: false

concurrency:
  group: pinterest-old-boards-posting
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  post-to-old-boards:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install system fonts and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu gsfonts ffmpeg

      - name: Check and auto-create USA trending boards
        if: ${{ github.event.inputs.create_trending_boards != 'false' }}
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          DRY_RUN_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi
          python create_trending_boards.py $DRY_RUN_ARG || echo "Board creation completed with warnings"

      - name: Post to 1-year-old boards
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          PINS="${{ github.event.inputs.pins_count || '4' }}"
          DRY_RUN_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi
          python old_boards_poster.py --pins-count $PINS $DRY_RUN_ARG

      - name: Commit and push history updates
        if: always()
        run: |
          set +e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posting_history_v2.json daily_pin_count.json dynamic_boards.json secrets.enc 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update 1y board posting history [skip ci]" || true
          fi
          git reset --hard HEAD 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          TARGET_BRANCH="${{ github.ref_name }}"
          TARGET_BRANCH="${TARGET_BRANCH:-develop}"
          git pull origin "$TARGET_BRANCH" --rebase --autostash 2>/dev/null || true
          for i in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Successfully pushed 1y board history to $TARGET_BRANCH"
              break
            fi
            echo "Push to $TARGET_BRANCH failed, retrying ($i/3)..."
            sleep 2
            git rebase --abort 2>/dev/null || true
            git pull origin "$TARGET_BRANCH" --rebase --autostash 2>/dev/null || true
          done
          exit 0

      - name: Upload posting history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: old-boards-posting-history-${{ github.run_number }}
          path: posting_history_v2.json
          retention-days: 30
