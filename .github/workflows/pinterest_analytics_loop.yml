name: Evergreen Pinterest Analytics Loop

on:
  schedule:
    # Runs at 1:00 AM UTC Mon, Wed, Fri (8:00 PM EST / 9:00 PM EDT)
    # Peak evening traffic for US women shoppers
    - cron: '0 1 * * 1,3,5'
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Strategy to run (daily or biweekly)'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - biweekly
      ignore_history:
        description: 'Ignore repin history to allow testing'
        required: false
        default: false
        type: boolean

jobs:
  analytics_and_repin:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Dependencies
        working-directory: ./
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install webdriver-manager selenium requests
          
      - name: Download previous repin history (if exists)
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          name: pinterest-repin-history-*
          name_is_regexp: true
          workflow: pinterest_analytics_loop.yml
          if_no_artifact_found: warn
          path: .

      - name: Flatten repin history
        run: |
          found=$(find . -maxdepth 2 -name "repin_history.json" ! -path "./repin_history.json" | sort | tail -1)
          if [ -n "$found" ]; then
            echo "Using repin history from: $found"
            cp "$found" repin_history.json
          fi
        continue-on-error: true
          
      - name: Decrypt Secrets & Run Analytics Loop
        working-directory: ./
        env:
          # Keys passed to secrets_manager.py for decryption
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          
          # Standard env fallbacks
          PINTEREST_EMAIL: ${{ secrets.PINTEREST_EMAIL }}
          PINTEREST_PASSWORD: ${{ secrets.PINTEREST_PASSWORD }}
          PINTEREST_COOKIES_B64: ${{ secrets.PINTEREST_COOKIES_B64 }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STRATEGY="${{ github.event.inputs.strategy }}"
            IGNORE_HISTORY="${{ github.event.inputs.ignore_history }}"
          else
            DAY=$(date +%d)
            if [ "$DAY" = "01" ] || [ "$DAY" = "15" ]; then
              STRATEGY="biweekly"
            else
              STRATEGY="daily"
            fi
            IGNORE_HISTORY="false"
          fi
          echo "Selected strategy: $STRATEGY"
          echo "Ignore history: $IGNORE_HISTORY"
          
          IGNORE_FLAG=""
          if [ "$IGNORE_HISTORY" = "true" ]; then
            IGNORE_FLAG="--ignore-history"
          fi
          
          if [ "$STRATEGY" = "biweekly" ]; then
            python pinterest_analytics_loop.py --strategy biweekly --limit 3 --days 60 --template 13 $IGNORE_FLAG
          else
            python pinterest_analytics_loop.py --strategy daily --limit 1 --days 7 --template 13 $IGNORE_FLAG
          fi
          
      - name: Upload Logs and History
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinterest-repin-history-${{ github.run_number }}
          path: |
            *.log
            repin_history.json
          retention-days: 30