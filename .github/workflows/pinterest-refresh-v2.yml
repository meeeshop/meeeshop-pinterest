name: Pinterest Refresh Pins V2

# V2 — Phase 2 refresh strategy
# Max 4 refresh pins per window (2 windows: 2-day and 4-7-day) = 4 pins/day ceiling
# Runs 30 min after each V2 daily posting run to "warm up" fresh pins
# Uses content_generator_v2 for USA-targeted refresh content
# Style rotation: refresh pins use a different visual style from the morning fresh pins
#
# Schedule — 30 min after daily V2 posts (USA women peak slots):
#   14:30 UTC = 10:30 AM ET — after mid-morning fresh pin run
#   18:30 UTC =  2:30 PM ET — after post-lunch fresh pin run
#   23:30 UTC =  7:30 PM ET — after after-work fresh pin run
#
# Note: Evening prime slot (9 PM ET) intentionally skipped for refresh — that
# slot is reserved for fresh new pins to maximise first-impression engagement.
# Analytics loop runs at 8 PM ET to fill the gap cleanly.

on:
  schedule:
    - cron: '30 14 * * *'   # 10:30 AM ET — after morning fresh run
    - cron: '30 18 * * *'   #  2:30 PM ET — after post-lunch fresh run
    - cron: '30 23 * * *'   #  7:30 PM ET — after after-work fresh run
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (simulate refresh without actually posting)'
        type: boolean
        required: false
        default: false
      image_style:
        description: 'Pin image style for refresh pins'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - hero
          - card
          - collage

concurrency:
  group: pinterest-refresh-v2
  cancel-in-progress: false   # Don't cancel — each refresh slot is independent

permissions:
  actions: read
  contents: write

jobs:
  refresh-pins-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install system fonts and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation fonts-dejavu gsfonts ffmpeg

      - name: Run refresh posting (V2)
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_IMAGE_STYLE: ${{ github.event.inputs.image_style || 'auto' }}
          PINTEREST_DAILY_CAP: '15'
          PINTEREST_WEEKEND_CAP: '18'
        run: |
          python pinterest_refresh_v2.py

      - name: Commit and push history updates
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add refresh_history_v2.json refresh_history.json posting_history_v2.json posting_history.json daily_pin_count.json || true
          git commit -m "chore: auto-update posting and refresh history [skip ci]" || echo "No changes to commit"
          git pull origin ${{ github.ref_name }} --rebase || true
          git push origin HEAD || echo "Failed to push history updates"

      - name: Upload V2 refresh history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-history-v2-${{ github.run_number }}
          path: |
            refresh_history_v2.json
            posting_history_v2.json
            daily_pin_count.json
          retention-days: 30
