name: "Site Health: 404 Prevention & Rich Pins Validator"

# Audits pinned product and blog URLs from history to detect dead links (404s).
# Automatically creates Shopify 301 redirects to relevant active collections so
# Pinterest crawlers and organic shoppers never encounter a broken page.
# Validates OpenGraph & Schema.org JSON-LD metadata for Product Rich Pins.
#
# Weekly Schedule:
#   Sundays at 06:00 UTC = 2:00 AM ET / 11:00 PM PT

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of recent URLs to audit'
        required: false
        default: '50'
        type: string

permissions:
  contents: write

jobs:
  link_health_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install beautifulsoup4

      - name: Run Dead-Link & Rich Pins Audit
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '50' }}"
          echo "Starting Pinterest Link Health & Rich Pins Audit (Sample: $LIMIT)..."
          python pinterest_link_health_and_rich_pins.py --limit $LIMIT

      - name: Commit and Push Link Health Report
        if: always()
        run: |
          set +e
          git config --local user.name "GitHub Action Bot"
          git config --local user.email "action@github.com"
          git add link_health_report.json secrets.enc 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(pinterest): record link health audit report [skip ci]" || true
          fi
          git reset --hard HEAD 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          TARGET_BRANCH="${{ github.ref_name }}"
          TARGET_BRANCH="${TARGET_BRANCH:-develop}"
          git pull origin "$TARGET_BRANCH" --rebase --autostash 2>/dev/null || true
          for i in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Successfully pushed link health report to $TARGET_BRANCH"
              break
            fi
            echo "Push to $TARGET_BRANCH failed, retrying ($i/3)..."
            sleep 2
            git rebase --abort 2>/dev/null || true
            git pull origin "$TARGET_BRANCH" --rebase --autostash 2>/dev/null || true
          done
          exit 0

      - name: Upload Link Health Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-health-report-${{ github.run_number }}
          path: link_health_report.json
          retention-days: 30
          if-no-files-found: ignore
