name: Weekly Pinterest Analytics Report

on:
  schedule:
    - cron: '0 12 * * 0'   # Every Sunday at 12:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate Analytics Report
        run: |
          python analytics_report.py

      - name: Commit and push report
        if: always()
        run: |
          set +e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly_analytics_report.json secrets.enc 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-generate weekly analytics report [skip ci]" || true
          fi
          git reset --hard HEAD 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          TARGET_BRANCH="${{ github.ref_name }}"
          TARGET_BRANCH="${TARGET_BRANCH:-develop}"
          git pull origin "$TARGET_BRANCH" --rebase --autostash 2>/dev/null || true
          for i in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Successfully pushed weekly analytics report to $TARGET_BRANCH"
              break
            fi
            echo "Push to $TARGET_BRANCH failed, retrying ($i/3)..."
            sleep 2
            git rebase --abort 2>/dev/null || true
            git pull origin "$TARGET_BRANCH" --rebase --autostash 2>/dev/null || true
          done
          exit 0

      - name: Upload Weekly Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-analytics-report-${{ github.run_number }}
          path: weekly_analytics_report.json
          retention-days: 30
