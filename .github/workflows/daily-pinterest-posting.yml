name: Daily Pinterest Posting

# Runs once per day — posts all 17 pins in one job (~20 min total).
# Pins go to 17 different boards in sequence with 30-60s gaps between each.
# Trigger: 12:00 UTC = 8 AM ET / 7 AM CT (pre-peak warm-up, finishes by 8:20 AM ET)

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      pins_count:
        description: 'Number of pins to post (default: 17)'
        required: false
        default: '17'

jobs:
  post-to-pinterest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post all daily pins
        env:
          PINTEREST_COOKIES_B64: ${{ secrets.PINTEREST_COOKIES_B64 }}
          PINTEREST_EMAIL: ${{ secrets.PINTEREST_EMAIL }}
          PINTEREST_PASSWORD: ${{ secrets.PINTEREST_PASSWORD }}
          PINTEREST_USERNAME: ${{ secrets.PINTEREST_USERNAME }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          STORE_BASE_URL: ${{ secrets.STORE_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PINS_TO_POST: ${{ github.event.inputs.pins_count || '17' }}
        run: |
          python pinterest_daily.py

      - name: Upload posting history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posting-history-${{ github.run_number }}
          path: posting_history.json
          retention-days: 30
