name: Daily Pinterest Posting

# V1 — DISABLED (schedule removed). Use daily-pinterest-posting-v2.yml instead.
# To roll back: re-add the schedule block below and disable V2 workflow.
#
# Original schedule (kept for reference):
#   12:00 UTC = 8 AM ET — morning scroll
#   17:00 UTC = 1 PM ET — lunch break
#   21:00 UTC = 5 PM ET — after work
#   01:00 UTC = 9 PM ET — prime time

on:
  workflow_dispatch:
    inputs:
      pins_count:
        description: 'Number of pins to post (default: 4)'
        required: false
        default: '4'

permissions:
  actions: read
  contents: read

jobs:
  post-to-pinterest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download posting history artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          name: posting-history-*
          name_is_regexp: true
          workflow: daily-pinterest-posting.yml
          if_no_artifact_found: warn
          path: .
        continue-on-error: true

      - name: Flatten posting history
        run: |
          found=$(find . -maxdepth 2 -name "posting_history.json" ! -path "./posting_history.json" | sort | tail -1)
          if [ -n "$found" ]; then
            echo "Using posting history from: $found"
            cp "$found" posting_history.json
          fi
        continue-on-error: true

      - name: Post daily pins
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          PINS_TO_POST: ${{ github.event.inputs.pins_count || '4' }}
        run: |
          python pinterest_daily.py

      - name: Upload posting history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posting-history-${{ github.run_number }}
          path: posting_history.json
          retention-days: 30
