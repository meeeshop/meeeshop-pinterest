name: Daily Pinterest Posting

on:
  schedule:
    - cron: '0 14 * * *'  # 2 PM UTC (10 AM EST, peak women's activity)
  workflow_dispatch:  # Allow manual trigger

jobs:
  post-to-pinterest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily posting
        env:
          PINTEREST_COOKIES_B64: ${{ secrets.PINTEREST_COOKIES_B64 }}
          PINTEREST_EMAIL: ${{ secrets.PINTEREST_EMAIL }}
          PINTEREST_PASSWORD: ${{ secrets.PINTEREST_PASSWORD }}
          PINTEREST_USERNAME: ${{ secrets.PINTEREST_USERNAME }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          STORE_BASE_URL: ${{ secrets.STORE_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python pinterest_daily.py

      - name: Upload posting history
        uses: actions/upload-artifact@v4
        with:
          name: posting-history
          path: posting_history.json
          retention-days: 30
