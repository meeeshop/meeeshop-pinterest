name: Pinterest Refresh Pins

# Runs twice a day to catch products due for their 48h or 96h refresh.
# Creates a BRAND NEW pin (different image template) to a different board.
# Pinterest sees it as fresh content — not a repin/duplicate.
#
# Schedule logic:
#   Each product gets up to 2 refreshes after its original post:
#     Refresh 1 → 48h after original  (different template, different board)
#     Refresh 2 → 96h after original  (yet another template, yet another board)
#
# Running twice/day (noon + midnight UTC) means no product waits more than
# 12h past its refresh window. ~2-5 min per run = minimal workflow minutes used.

on:
  schedule:
    - cron: '0 0 * * *'   # midnight UTC
    - cron: '0 12 * * *'  # noon UTC (offset from daily posting at same time — runs after)
  workflow_dispatch: {}

jobs:
  refresh-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download posting history artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          name: posting-history-*
          name_is_regexp: true
          workflow: daily-pinterest-posting.yml
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Run refresh posting
        env:
          PINTEREST_COOKIES_B64: ${{ secrets.PINTEREST_COOKIES_B64 }}
          PINTEREST_EMAIL: ${{ secrets.PINTEREST_EMAIL }}
          PINTEREST_PASSWORD: ${{ secrets.PINTEREST_PASSWORD }}
          PINTEREST_USERNAME: ${{ secrets.PINTEREST_USERNAME }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          STORE_BASE_URL: ${{ secrets.STORE_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python pinterest_refresh.py

      - name: Upload refresh history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-history-${{ github.run_number }}
          path: |
            refresh_history.json
            posting_history.json
          retention-days: 30
