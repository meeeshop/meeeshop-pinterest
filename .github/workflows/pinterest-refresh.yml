name: Pinterest Refresh Pins

# Runs 30 min after each daily posting run to catch any products due for 48h/96h refresh.
# Creates a BRAND NEW pin (different image template) to a different board.
# Pinterest sees it as fresh content — not a repin/duplicate.
#
# Schedule (UTC → US times, 30 min after daily posting):
#   12:30 UTC = 8:30 AM ET   — after morning run
#   17:30 UTC = 1:30 PM ET   — after lunch run
#   21:30 UTC = 5:30 PM ET   — after after-work run
#   01:30 UTC = 9:30 PM ET   — after prime-time run
#
# Each run: ~2-3 min (posts up to 10 refresh pins max, typically 2-5).

on:
  schedule:
    - cron: '30 12 * * *'   # 8:30 AM ET
    - cron: '30 17 * * *'   # 1:30 PM ET
    - cron: '30 21 * * *'   # 5:30 PM ET
    - cron: '30 1 * * *'    # 9:30 PM ET
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  refresh-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download posting history artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          name: posting-history-*
          name_is_regexp: true
          workflow: daily-pinterest-posting.yml
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Download refresh history artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          name: refresh-history-*
          name_is_regexp: true
          workflow: pinterest-refresh.yml
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Run refresh posting
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          python pinterest_refresh.py

      - name: Upload refresh history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-history-${{ github.run_number }}
          path: |
            refresh_history.json
            posting_history.json
          retention-days: 30
