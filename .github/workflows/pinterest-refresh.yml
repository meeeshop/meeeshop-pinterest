name: Pinterest Refresh Pins

# V1 — DISABLED (schedule removed). Use pinterest-refresh-v2.yml instead.
# To roll back: re-add the schedule block below and disable V2 refresh workflow.
#
# Original schedule (kept for reference):
#   12:30 UTC = 8:30 AM ET
#   17:30 UTC = 1:30 PM ET
#   21:30 UTC = 5:30 PM ET
#   01:30 UTC = 9:30 PM ET

on:
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  refresh-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run refresh posting
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python pinterest_refresh.py

      - name: Upload refresh history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-history-${{ github.run_number }}
          path: |
            refresh_history.json
            posting_history.json
          retention-days: 30
