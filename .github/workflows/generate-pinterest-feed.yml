name: Generate Pinterest Catalog Feeds

on:
  schedule:
    - cron: '0 4 * * *'  # Runs daily at 04:00 UTC (12:00 AM ET)
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and Upload Pinterest Feeds
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          python generate_pinterest_supplemental_feed.py
