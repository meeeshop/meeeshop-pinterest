name: Daily Video Pins (YouTube Shorts → Pinterest)

# STEP 1 — VALIDATE FIRST:
#   Go to Actions → "Daily Video Pins" → Run workflow → set dry_run = true
#   This runs the full pipeline (auth, YouTube scrape, download, content) but
#   skips the actual Pinterest upload. Check the logs. If everything is green,
#   run again with dry_run = false to post the first real video pin.
#
# STEP 2 — PRODUCTION SCHEDULE (2 pins/day at peak USA women's shopping times):
#   12:00 UTC = 8 AM ET  — morning browse (commute / coffee scroll)
#   01:00 UTC = 9 PM ET  — prime time (highest engagement for USA women)
#
# Each run posts up to 2 video pins (MAX_PINS_PER_RUN=2) using the newest
# unposted Shorts from the last 48h. Videos have a 10-day repost cooldown.

on:
  schedule:
    - cron: '0 12 * * *'   # 8 AM ET  — morning scroll
    - cron: '0 1  * * *'   # 9 PM ET  — prime time
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate only, do not post)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      pins_per_run:
        description: 'Max video pins to post per run (1 or 2)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'

permissions:
  actions: read
  contents: read

jobs:
  post-video-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yt-dlp

      - name: Download video posting history artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          name: video-posting-history-*
          name_is_regexp: true
          workflow: daily-video-pins.yml
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Post video pins
        env:
          PINTEREST_COOKIES_B64: ${{ secrets.PINTEREST_COOKIES_B64 }}
          PINTEREST_EMAIL: ${{ secrets.PINTEREST_EMAIL }}
          PINTEREST_PASSWORD: ${{ secrets.PINTEREST_PASSWORD }}
          PINTEREST_USERNAME: ${{ secrets.PINTEREST_USERNAME }}
          SHOPIFY_STORE_URL: ${{ secrets.SHOPIFY_STORE_URL }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          STORE_BASE_URL: ${{ secrets.STORE_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CHANNEL_URL: https://www.youtube.com/@MeeeShop
          # Netscape-format YouTube cookies (base64) — bypasses yt-dlp bot detection on CI IPs.
          # Export from logged-in browser using "Get cookies.txt LOCALLY" extension, base64-encode, store as secret.
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          # Scheduled runs: 2 pins/day. Manual dispatch uses the input value.
          MAX_PINS_PER_RUN: ${{ github.event.inputs.pins_per_run || '2' }}
          # Scheduled runs never dry-run. Manual dispatch defaults to dry_run=true for safety.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python pinterest_video_daily.py

      - name: Upload video posting history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-posting-history-${{ github.run_number }}
          path: video_posting_history.json
          retention-days: 30
