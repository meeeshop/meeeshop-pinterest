name: Daily Video Pins (Product Slideshow → Pinterest)

# STEP 1 — VALIDATE FIRST:
#   Go to Actions → "Daily Video Pins" → Run workflow → set dry_run = true
#   This runs the full pipeline (auth, product pick, video build, content) but
#   skips the actual Pinterest upload. Check the logs. If everything is green,
#   run again with dry_run = false to post the first real video pin.
#
# STEP 2 — PRODUCTION SCHEDULE (2 pins/day at peak USA women's shopping times):
#   12:00 UTC = 8 AM ET  — morning browse (commute / coffee scroll)
#   01:00 UTC = 9 PM ET  — prime time (highest engagement for USA women)
#
# Each run posts 1 video pin (MAX_PINS_PER_RUN=1).
# Daily total: 2 video pins + 16 rich product pins = 18 pins/day (safe limit, no blocking).
# Videos are generated locally from Shopify product images — no YouTube dependency.
# Products have a 10-day repost cooldown.

on:
  schedule:
    - cron: '0 13 * * *'   # 9 AM ET — morning coffee scroll
    - cron: '0 19 * * *'   # 3 PM ET — afternoon browse
    - cron: '0 1  * * *'   # 9 PM ET — prime time
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate only, do not post)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      pins_per_run:
        description: 'Max video pins to post per run'
        required: false
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'

permissions:
  actions: read
  contents: write

jobs:
  post-video-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post video pins
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          MAX_PINS_PER_RUN: ${{ github.event.inputs.pins_per_run || '3' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python pinterest_video_daily.py

      - name: Commit and push video history updates
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add video_posting_history.json || true
          git commit -m "chore: auto-update video posting history [skip ci]" || echo "No changes to commit"
          git pull origin ${{ github.ref_name }} --rebase || true
          git push origin HEAD || echo "Failed to push video history updates"

      - name: Upload video posting history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-posting-history-${{ github.run_number }}
          path: video_posting_history.json
          retention-days: 30
