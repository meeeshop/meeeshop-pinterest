name: Tag Popular Pins with In-Stock Products

on:
  schedule:
    - cron: '0 16 * * *'  # Runs daily at 16:00 UTC (11:00 AM EST)
  workflow_dispatch:
    inputs:
      test_pin_id:
        description: 'Single Pinterest Pin ID to test (e.g. 962222276632068955). Leave blank for batch mode.'
        required: false
        default: ''
        type: string
      mode:
        description: 'Execution Mode (dry-run = Preview only, apply = Live update on Pinterest)'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
      max_pins:
        description: 'Maximum number of pins to process per batch run'
        required: false
        default: '10'
        type: string

permissions:
  contents: write

jobs:
  tag_popular_pins:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install chromium --with-deps

      - name: Execute Tag Popular Pins Automation
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          PINTEREST_COOKIES_B64: ${{ secrets.PINTEREST_COOKIES_B64 }}
          PINTEREST_USERNAME: ${{ secrets.PINTEREST_USERNAME }}
          PINTEREST_EMAIL: ${{ secrets.PINTEREST_EMAIL }}
          PINTEREST_PASSWORD: ${{ secrets.PINTEREST_PASSWORD }}
        run: |
          CMD="python tag_popular_pins_with_products.py --max-pins ${{ inputs.max_pins || '10' }}"

          if [ "${{ inputs.mode }}" = "apply" ]; then
            CMD="$CMD --apply"
          else
            CMD="$CMD --dry-run"
          fi

          if [ -n "${{ inputs.test_pin_id }}" ]; then
            CMD="$CMD --test-pin-id ${{ inputs.test_pin_id }}"
          fi

          echo "Executing command: $CMD"
          eval $CMD

      - name: Upload Debug Artifacts (Screenshots & HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-tag-debug-artifacts
          path: |
            playwright_*.png
            playwright_*.html
            *.png
          if-no-files-found: ignore

      - name: Commit and Push Updated History
        if: always()
        run: |
          set +e
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add tagged_popular_pins_history.json secrets.enc 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(pinterest): tag popular pins with in-stock products [skip ci]" || true
          fi
          git reset --hard HEAD 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          TARGET_BRANCH="${{ github.ref_name }}"
          TARGET_BRANCH="${TARGET_BRANCH:-develop}"
          git pull origin "$TARGET_BRANCH" --rebase --autostash 2>/dev/null || true
          for i in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Successfully pushed popular pins history to $TARGET_BRANCH"
              break
            fi
            echo "Push to $TARGET_BRANCH failed, retrying ($i/3)..."
            sleep 2
            git rebase --abort 2>/dev/null || true
            git pull origin "$TARGET_BRANCH" --rebase --autostash 2>/dev/null || true
          done
          exit 0

