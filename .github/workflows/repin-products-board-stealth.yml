name: Repin Products Board to Organized Boards (Stealth)

# Stealth Playwright Workflow for organizing pins from _products board into niche boards.
# Prevents duplicate saves and stays within safe Pinterest algorithm boundaries.

on:
  schedule:
    - cron: '0 15 * * *'   # 11:00 AM ET / 15:00 UTC — Daily midday organizer run
  workflow_dispatch:
    inputs:
      pins_count:
        description: 'Number of pins to save (default: 8)'
        required: false
        default: '8'
      daily_cap:
        description: 'Daily repin limit (default: 20)'
        required: false
        default: '20'
      dry_run:
        description: 'Dry run (simulate without saving)'
        type: boolean
        required: false
        default: false

concurrency:
  group: pinterest-repin-products
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  repin-products-board:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium --with-deps

      - name: Run Stealth Products Board Saver
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          PYTHONUNBUFFERED: '1'
        run: |
          COUNT="${{ github.event.inputs.pins_count || '8' }}"
          CAP="${{ github.event.inputs.daily_cap || '20' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          
          echo "Starting Products Board Organizer..."
          python stealth_products_board_saver.py --count $COUNT --cap $CAP $DRY_RUN_FLAG

      - name: Commit and push repin history updates
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add repin_history_stealth.json .pinterest_cookies || true
          git commit -m "chore: auto-update stealth repin history [skip ci]" || echo "No changes to commit"
          git pull origin ${{ github.ref_name }} --rebase || true
          git push origin HEAD || echo "Failed to push history updates"
