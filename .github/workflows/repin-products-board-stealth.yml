name: Repin Products Board to Organized Boards (Stealth)

# Stealth Playwright Workflow for organizing in-stock catalog pins from _products into niche boards.
# Automatically filters out deleted (404) or sold-out items to protect conversion and shopper experience.
# Scheduled for high-converting US women's peak browsing hours.

on:
  schedule:
    - cron: '0 12 * * *'   # 8:00 AM ET / 12:00 UTC — Morning East Coast commute & coffee scroll
    - cron: '30 17 * * *'  # 1:30 PM ET / 10:30 AM PT / 17:30 UTC — Mid-day lunch & shopping break
    - cron: '0 21 * * *'   # 5:00 PM ET / 2:00 PM PT / 21:00 UTC — After-work unwind scroll
    - cron: '0 2 * * *'    # 10:00 PM ET / 9:00 PM CT / 7:00 PM PT / 02:00 UTC — Night Prime-Time Bedtime Lounge (Highest US Peak!)
  workflow_dispatch:
    inputs:
      pins_count:
        description: 'Number of in-stock pins to save (default: 4)'
        required: false
        default: '4'
      daily_cap:
        description: 'Daily repin limit (default: 20)'
        required: false
        default: '20'
      dry_run:
        description: 'Dry run (simulate without saving)'
        type: boolean
        required: false
        default: false

concurrency:
  group: pinterest-repin-products
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  repin-products-board:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright requests

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium --with-deps

      - name: Run Stealth In-Stock Products Board Saver
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          PYTHONUNBUFFERED: '1'
        run: |
          COUNT="${{ github.event.inputs.pins_count || '4' }}"
          CAP="${{ github.event.inputs.daily_cap || '20' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          
          echo "Starting In-Stock Products Board Organizer..."
          python stealth_products_board_saver.py --count $COUNT --cap $CAP $DRY_RUN_FLAG

      - name: Commit and push repin history updates
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add repin_history_stealth.json .pinterest_cookies || true
          git commit -m "chore: auto-update stealth repin history [skip ci]" || echo "No changes to commit"
          git pull origin ${{ github.ref_name }} --rebase || true
          git push origin HEAD || echo "Failed to push history updates"
